apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
        - name: churn-api-container
          image: namrata935/churn-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "random_forest_model.pkl"

